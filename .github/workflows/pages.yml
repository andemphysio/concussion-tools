name: Publish Concussion Tools to GitHub Pages

# Publication is deliberately manual. Pushing to main does not deploy the site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public site files
        run: |
          mkdir -p _site/version-1 _site/version-2
          cp index.html styles.css LICENSE .nojekyll _site/
          cp version-1/index.html version-1/styles.css version-1/app.js version-1/VERSION _site/version-1/
          cp version-2/index.html version-2/styles.css version-2/app.js version-2/VERSION _site/version-2/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
